include:
  - project: 'papers/papers-internal/internal'
    file: '/.base-gitlab-ci.yml'

variables:
  NAMESPACE: multisig-orchestration
  TEST_TAG: multisig_orchestration_frontend_test_$CI_COMMIT_SHA

stages:
  - build
  - test
  - build_serve
  - publish
  - deploy

build:
  stage: build
  script:
    - docker build --target angular-build -t $TEST_TAG .
  tags:
    - docker

test:
  allow_failure: false
  stage: test
  script:
    - docker run --name unit-$CI_COMMIT_SHA $TEST_TAG yarn test-ci
    - docker run --name lint-$CI_COMMIT_SHA $TEST_TAG yarn lint-ci
    - docker cp unit-$CI_COMMIT_SHA:/app/coverage/dapp-frontend/report-lcov/lcov.info lcov.info
    - docker cp lint-$CI_COMMIT_SHA:/app/lintReport.json lintReport.json
  after_script:
    - docker rm -f unit-$CI_COMMIT_SHA || true
    - docker rm -f lint-$CI_COMMIT_SHA || true
  tags:
    - docker
  artifacts:
    paths:
      - lcov.info
      - lintReport.json

.base_build_serve:
  script:
    - docker build --build-arg RUN_ENV=$CI_ENVIRONMENT_NAME -t $GOOGLE_TAG-$CI_ENVIRONMENT_NAME .

build-serve-dev:
  stage: build_serve
  script:
    - !reference [.base_build_serve, script]
  only:
    - develop
  environment:
    name: development

build-serve-prod:
  stage: build_serve
  script:
    - !reference [.base_build_serve, script]
  only:
    - master
  environment:
    name: production

publish-dev:
  stage: publish
  needs: ['build-serve-dev']
  extends: .publish-dev
  script:
    - docker tag $GOOGLE_TAG-$CI_ENVIRONMENT_NAME $GOOGLE_TAG_DEV
    - docker tag $GOOGLE_TAG-$CI_ENVIRONMENT_NAME $GOOGLE_TAG_LATEST_DEV
    - docker push $GOOGLE_TAG_DEV
    - docker push $GOOGLE_TAG_LATEST_DEV
  environment:
    name: development
    action: prepare

